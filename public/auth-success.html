<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Success - Plexify</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .checkmark {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }
        p {
            margin: 0;
            opacity: 0.9;
        }
        .spinner {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✅</div>
        <h1>Authentication Successful!</h1>
        <p>You have been successfully authenticated with Keycloak.</p>
        <div class="spinner"></div>
        <p>Redirecting back to extension...</p>
    </div>

    <script>
        // Try to communicate with the extension
        window.addEventListener('load', function() {
            try {
                // Post message to parent window (if in iframe)
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'AUTH_SUCCESS' }, '*');
                }
                
                // Try to access the extension directly
                if (typeof chrome !== 'undefined' && chrome.runtime) {
                    // We're in an extension context, try to navigate to popup
                    const extensionUrl = chrome.runtime.getURL('popup.html');
                    window.location.href = extensionUrl;
                } else {
                    // Not in extension context, try to close window or redirect
                    setTimeout(() => {
                        try {
                            window.close();
                        } catch (e) {
                            // If we can't close, redirect to extension URL
                            window.location.href = 'chrome-extension://inlgehhjkndfmabfgnomgcmchnmiogjo/popup.html';
                        }
                    }, 2000);
                }
            } catch (error) {
                console.error('Error handling auth success:', error);
                // Fallback: close window after delay
                setTimeout(() => {
                    try {
                        window.close();
                    } catch (e) {
                        console.log('Cannot close window');
                    }
                }, 3000);
            }
        });
    </script>
</body>
</html>
